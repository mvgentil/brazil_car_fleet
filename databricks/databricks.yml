bundle:
  name: frota-veiculos-brasil

variables:
  catalog:
    description: "Unity Catalog catalog name"
    default: brazil_car_fleet
  raw_schema:
    description: "Schema onde os Volumes raw estão criados"
    default: raw_data
  bronze_schema:
    description: "Schema de destino para tabelas bronze"
    default: bronze
  silver_schema:
    description: "Schema de destino para tabelas silver"
    default: silver
  gold_schema:
    description: "Schema de destino para tabelas gold"
    default: gold
  sql_warehouse_id:
    description: "ID do SQL Warehouse para o Dashboard"
    default: "123389392105797f"

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

include:
  - resources/*.yml
